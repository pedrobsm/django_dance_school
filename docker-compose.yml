version: "3.3"
services:
  web:
    image: danceschool_web:latest
    deploy:
      replicas: 1
    env_file: 
      - env.default
      - env.web
    volumes:
      - staticfiles:/data/web/school/staticfiles
      - media:/data/web/school/media
      - private_media:/data/web/school/smedia
      - ./backups/web:/backup
      - ./custom:/data/web/custom
    secrets:
      - postgres_url
      - django_secret_key
    working_dir: /data/web
    command: gunicorn school.wsgi:application -w 2 -b :8000
    networks:
      danceschool_default:
        aliases:
          - web
    depends_on:
      - postgres

  nginx:
    image: danceschool_nginx:latest
    labels:
      - com.github.jrcs.letsencrypt_nginx_proxy_companion.nginx_proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - certs:/etc/nginx/certs:ro
      - vhost.d:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - staticfiles:/data/web/staticfiles
      - media:/data/web/media
    networks:
      danceschool_default:
        aliases:
          - nginx
    depends_on:
      - web

  letsencrypt-companion:
    image: jrcs/letsencrypt-nginx-proxy-companion
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - certs:/etc/nginx/certs:rw
      - vhost.d:/etc/nginx/vhost.d
      - acme:/etc/acme.sh
      - html:/usr/share/nginx/html
    environment:
      - NGINX_PROXY_CONTAINER=nginx
    networks:
      danceschool_default:
        aliases:
          - letsencrypt
    depends_on:
      - nginx

  postgres:
    # postgres:10.6 (CMS3/Django 3.1 era) está EOL há muito. O PR #187
    # (patch obrigatório do setupschool para CMS 5, ver CLAUDE.md) foi
    # validado ponta-a-ponta pelo autor sobre Postgres 18 — usamos a mesma
    # versão aqui por consistência com esse teste de referência.
    image: postgres:18
    hostname: postgres
    deploy:
      replicas: 1
    environment:
      # A imagem oficial recusa-se a arrancar sem isto ou POSTGRES_PASSWORD
      # (postgres:10.6, usado até 2026-08-28, tinha esse comportamento
      # implícito — a imagem oficial endureceu isto entretanto). O design
      # deste projeto já assumia isto: o superuser 'postgres' só é acedido
      # localmente, via socket Unix, pelo setup_stack.sh (que cria depois
      # um utilizador com password real, guardada no secret postgres_url,
      # para a app usar). "trust" alarga isso também a ligações TCP, mas
      # postgres:5432 nunca é publicado fora da rede overlay
      # danceschool_default — mesmo risco implícito que já existia, agora
      # só explícito.
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - ./backups/postgresql:/backup
      # postgres:18 mudou o layout do data directory para ser compatível
      # com pg_ctlcluster (nome de diretório com a major version dentro),
      # e recusa-se a arrancar se o volume for montado diretamente em
      # .../data como acontecia com postgres:10.6. A partir da 18, o mount
      # correto é a raiz /var/lib/postgresql — a imagem cria a
      # subestrutura sozinha. Ver docker-library/postgres#1259.
      - postgres:/var/lib/postgresql
    env_file: env.default
    networks:
      danceschool_default:
        aliases:
          - postgres

  redis:
    image: redis:latest
    hostname: redis
    deploy:
      replicas: 1
    networks:
      danceschool_default:
        aliases:
          - redis 

  huey:
    image: danceschool_web:latest
    deploy:
      replicas: 1
    # NOTA: só env.default, propositadamente. env.web tem VIRTUAL_HOST/
    # VIRTUAL_PORT/LETSENCRYPT_HOST para o nginx-proxy — o huey não serve
    # HTTP nenhum, mas se herdar essas variáveis o nginx-proxy mete o
    # container do huey na mesma pool de upstream do site (mesmo
    # VIRTUAL_HOST), causando 502/503 intermitentes quando o load balancing
    # calha nele.
    env_file:
     - env.default
    secrets:
      - postgres_url
      - django_secret_key
    volumes:
      - staticfiles:/data/web/school/staticfiles
      - media:/data/web/school/media
      - private_media:/data/web/school/smedia
      - ./backups/web:/backup
      - ./custom:/data/web/custom
    working_dir: /data/web
    command: python3 manage.py run_huey
    networks:
      danceschool_default:
        aliases:
          - huey
    depends_on:
      - postgres
 
volumes:
  postgres:
    external:
      name: danceschool_postgres
  staticfiles:
    external:
      name: danceschool_staticfiles
  media:
    external:
      name: danceschool_media
  private_media:
    external:
      name: danceschool_privatemedia
  certs:
    external:
      name: danceschool_certs
  vhost.d:
    external:
      name: danceschool_vhost.d
  acme:
    external:
      name: danceschool_acme
  html:
    external:
      name: danceschool_html

networks:
  danceschool_default:
    driver: overlay

secrets:
  postgres_user:
    external: true
  postgres_password:
    external: true
  postgres_url:
    external: true
  django_secret_key:
    external: true
