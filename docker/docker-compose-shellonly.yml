version: "3.3"
services:
  web:
    image: danceschool_web:latest
    deploy:
      replicas: 1
    env_file: ../env.default
    volumes:
      - staticfiles:/data/web/school/staticfiles
      - media:/data/web/school/media
      - private_media:/data/web/school/smedia
      - ../custom:/data/web/custom
    secrets:
      - postgres_url
      - django_secret_key
    working_dir: /data/web
    tty: true
    networks:
      danceschool_default:
        aliases:
          - web

  postgres:
    # Tem de ser a MESMA versão do postgres usada em ../docker-compose.yml —
    # o volume de dados (danceschool_postgres) é partilhado entre os dois, e
    # o Postgres recusa-se a arrancar sobre um data directory escrito por
    # uma major version diferente. Ver comentário lá para o porquê do 18.
    image: postgres:18
    hostname: postgres
    deploy:
      replicas: 1
    environment:
      # Ver comentário equivalente em ../docker-compose.yml.
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - ../backups/postgresql:/backup
      # Ver comentário equivalente em ../docker-compose.yml.
      - postgres:/var/lib/postgresql
    env_file: ../env.default
    networks:
      danceschool_default:
        aliases:
          - postgres

  redis:
    image: redis:latest
    hostname: redis
    deploy:
      replicas: 1
    networks:
      danceschool_default:
        aliases:
          - redis


volumes:
  postgres:
    external:
      name: danceschool_postgres
  staticfiles:
    external:
      name: danceschool_staticfiles
  media:
    external:
      name: danceschool_media
  private_media:
    external:
      name: danceschool_privatemedia

networks:
  danceschool_default:
    driver: overlay

secrets:
  postgres_user:
    external: true
  postgres_password:
    external: true
  postgres_url:
    external: true
  django_secret_key:
    external: true
